services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO: mongodb://mongo:27017/violet
      jwtSecret: change_me_in_compose
      CORS_ORIGIN: http://localhost:5000
      BUCKET_NAME: violet-products
      BUCKET_REGION: us-east-1
      ACCESS_KEY: minioadmin
      SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - mongo
      - minio

volumes:
  mongo_data:
  minio_data:
