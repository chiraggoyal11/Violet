name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO ready"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to start" >&2
          exit 1

      - name: Install API dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run API tests
        env:
          MONGO_TEST: mongodb://127.0.0.1:27017/violet_ci
          jwtSecret: ci_test_secret
          S3_ENDPOINT: http://127.0.0.1:9000
          BUCKET_NAME: violet-products
          BUCKET_REGION: us-east-1
          ACCESS_KEY: minioadmin
          SECRET_ACCESS_KEY: minioadmin
        run: npm test

      - name: Build frontend
        run: npm --prefix frontend run build
